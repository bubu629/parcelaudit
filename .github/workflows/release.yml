name: Build ParcelAudit Binaries
on:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npx @yao-pkg/pkg . --targets node20-macos-arm64,node20-win-x64,node20-linux-x64 --output dist/parcelaudit
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
